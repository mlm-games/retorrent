name: CI
on:
  pull_request:
  push:
    branches: "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "" # -Dwarnings
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  check-and-test:
    name: Check, lint, test (stable)
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-26.04-arm
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - run: rustup component add clippy rustfmt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev libudev-dev pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config
      - name: Configure pkg-config (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV

      - name: Set up MSYS2 and install Windows dependencies
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf

      - name: Configure pkg-config and PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG=$msys2\mingw64\bin\pkgconf.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$msys2\mingw64\lib\pkgconfig"
          Add-Content -Path $env:GITHUB_PATH -Value "$msys2\mingw64\bin"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with: { tool: nextest }

      - name: Test (nextest)
        run: cargo nextest run --workspace --all-features

  docs:
    name: Docs (warns are errors)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        env: { RUSTDOCFLAGS: "-D rustdoc::all" }
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: MSRV
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-features

  minimal-versions:
    name: Minimal versions build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-hack }

      - uses: Swatinem/rust-cache@v2
      - run: cargo generate-lockfile -Z minimal-versions || true
      - run: cargo hack build --workspace --all-features --ignore-private --no-dev-deps

  security:
    name: Security & licensing
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: actions-rust-lang/audit@v1
        with:
          denyWarnings: true
        continue-on-error: true

  semver:
    name: SemVer checks (pre-publish)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  android-apk:
    name: Android (aarch64) APK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load pins from release.yml
        run: |
          # yadaw style (with) or retorrent env style — try both
          API=$(sed -E -n 's/.*android-api.*"(.*)".*/\1/p' .github/workflows/release.yml | head -1)
          BT=$(sed -E -n 's/.*android-build-tools.*"(.*)".*/\1/p' .github/workflows/release.yml | head -1)
          NDK=$(sed -E -n 's/.*android-ndk-version.*"(.*)".*/\1/p' .github/workflows/release.yml | head -1)
          RAPK=$(sed -E -n 's/.*cargo-rapk-version.*"(.*)".*/\1/p' .github/workflows/release.yml | head -1)
          # fallback to env style (ANDROID_API: "37.0")
          if [ -z "$API" ]; then API=$(grep -m1 'ANDROID_API' .github/workflows/release.yml | sed -E 's/.*"([^"]+)".*/\1/'); fi
          if [ -z "$BT" ]; then BT=$(grep -m1 'ANDROID_BUILD_TOOLS' .github/workflows/release.yml | sed -E 's/.*"([^"]+)".*/\1/'); fi
          if [ -z "$NDK" ]; then NDK=$(grep -m1 'ANDROID_NDK_VERSION' .github/workflows/release.yml | sed -E 's/.*"([^"]+)".*/\1/'); fi
          if [ -z "$RAPK" ]; then RAPK=$(grep -m1 'CARGO_RAPK_VERSION' .github/workflows/release.yml | sed -E 's/.*"([^"]+)".*/\1/'); fi
          echo "ANDROID_API=$API" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=$NDK" >> "$GITHUB_ENV"
          echo "CARGO_RAPK_VERSION=$RAPK" >> "$GITHUB_ENV"
          echo "Loaded from release.yml: API=$API BT=$BT NDK=$NDK RAPK=$RAPK"

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v4

      - name: Install Android platforms and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Install Rust (host) + Android target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-rapk
        run: cargo install cargo-rapk@${{ env.CARGO_RAPK_VERSION }} --locked

      - name: Build Android APK (aarch64)
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at || 0 }}
        run: |
          cargo rapk build --target aarch64-linux-android --lib
          OUT_DIR="target/aarch64-linux-android/debug/apk"
          if [ -d "target/aarch64-linux-android/release/apk" ]; then
            OUT_DIR="target/aarch64-linux-android/release/apk"
          fi
          ls -l "$OUT_DIR"
          mkdir -p artifacts
          cp "$(ls -1t "$OUT_DIR"/*.apk | head -n1)" "artifacts/app-aarch64.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-aarch64-apk
          path: artifacts/*.apk
